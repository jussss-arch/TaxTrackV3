<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales and Expenses</title>

    <link rel="stylesheet" href="sales-expenses.css">
</head>
<body>

    <header class="top-banner">

        
                <button
    class="back-btn"
    onclick="history.back()">

    Back

            </button>

    </header>

    <main class="container">

        <h1>Sales and Expenses</h1>

        <div class="form-grid">

            <div class="field">
                <label>Annual Sales</label>
                <input type="text" id="annualSales" readonly>
            </div>

            <div class="field">
                <label>Utilities Expense</label>
                <input type="text" id="utilitiesExpense" readonly>
            </div>

            <div class="field">
                <label>Quarterly Sales</label>
                <input type="text" id="quarterlySales" readonly>
            </div>

            <div class="field">
                <label>Miscellaneous Expense</label>
                <input type="text" id="miscExpense" readonly>
            </div>

            <div class="field">
                <label>Annual Cost of Goods Sold</label>
                <input type="text" id="cogs" readonly>
            </div>

            <div class="field">
                <label>Tax and Licenses</label>
                <input type="text" id="taxLicenses" readonly>
            </div>

            <div class="field">
                <label>Rent Expense</label>
                <input type="text" id="rentExpense" readonly>
            </div>

            <div class="field">
                <label>Other Expenses</label>
                <input type="text" id="otherExpense" readonly>
            </div>

        </div>

        <div class="button-group">

            <button
                class="edit-btn"
                onclick="enableEdit()">

                Edit

            </button>

            <button
                class="save-btn"
                onclick="saveSalesExpenses()">

                Save

            </button>

        </div>

    </main>

    <script src="sales-expenses.js"></script>

</body>
</html>
